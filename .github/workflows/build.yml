
name: Build AimAssist

on:
  workflow_dispatch:
  push:
    paths:
      - 'aimassist-melee-vertical-hitbox-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source
        run: |
          unzip aimassist-melee-vertical-hitbox-source.zip -d source

      - name: Build JAR
        run: |
          cd source/aimassist-0.1.0-1.21.11
          chmod +x gradlew
          ./gradlew build -Pedition=user --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AimAssist-JAR
          path: source/aimassist1/build/libs/*.jar
          if-no-files-found: error
          
